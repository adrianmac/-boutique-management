{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Reports & Analytics</h2>

<div class="row">
    <!-- Monthly Revenue -->
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header">Monthly Revenue (Paid Invoices)</div>
            <div class="card-body">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Revenue by Event Type -->
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header">Revenue by Event Type</div>
            <div class="card-body">
                <canvas id="eventTypeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Top Items -->
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header">Top Rented Items</div>
            <div class="card-body">
                <canvas id="itemsChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Revenue Bar Chart
    const revenueCtx = document.getElementById('revenueChart').getContext('2d');
    new Chart(revenueCtx, {
        type: 'bar',
        data: {
            labels: {{ revenue_labels|safe }},
            datasets: [{
                label: 'Revenue ($)',
                data: {{ revenue_data|safe }},
                backgroundColor: '#ffccd5',
                borderColor: '#593d3d',
                borderWidth: 1
            }]
        },
        options: { scales: { y: { beginAtZero: true } } }
    });

    // 2. Event Type Pie Chart
    const eventTypeCtx = document.getElementById('eventTypeChart').getContext('2d');
    new Chart(eventTypeCtx, {
        type: 'pie',
        data: {
            labels: {{ event_type_labels|safe }},
            datasets: [{
                data: {{ event_type_data|safe }},
                backgroundColor: ['#ffb3c1', '#a2d2ff', '#cdb4db', '#bde0fe', '#ffc8dd'],
                hoverOffset: 4
            }]
        }
    });

    // 3. Top Items Doughnut Chart
    const itemsCtx = document.getElementById('itemsChart').getContext('2d');
    new Chart(itemsCtx, {
        type: 'doughnut',
        data: {
            labels: {{ item_labels|safe }},
            datasets: [{
                data: {{ item_data|safe }},
                backgroundColor: ['#ffccd5', '#fff0f3', '#ffb3c1', '#c9184a', '#800f2f']
            }]
        }
    });
</script>
{% endblock %}
