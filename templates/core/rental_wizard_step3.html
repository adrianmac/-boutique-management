{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Step 3: Seamstress Services (Optional)</div>
            <div class="card-body">
                <p class="text-muted">Do you need alterations for this rental?</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" name="skip" class="btn btn-outline-secondary">Skip / No Alterations</button>
                        <button type="submit" class="btn btn-primary">Add Service & Continue</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
