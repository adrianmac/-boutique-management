<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Labels</title>
    <style>
        body { font-family: sans-serif; }
        .label-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .label {
            border: 1px dashed #ccc;
            padding: 10px;
            width: 200px;
            text-align: center;
            page-break-inside: avoid;
        }
        .label img { max-width: 100px; }
        .label h3 { margin: 5px 0; font-size: 14px; }
        .label p { margin: 0; font-size: 12px; color: #666; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="no-print" style="margin-bottom: 20px;">
        <button onclick="window.print()">Print Labels</button>
    </div>
    <div class="label-grid">
        {% for obj in labels %}
        <div class="label">
            <img src="data:image/png;base64,{{ obj.qr }}" alt="QR">
            <h3>{{ obj.item.name }}</h3>
            <p>{{ obj.item.sku|default:"-" }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
