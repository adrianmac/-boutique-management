{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">New Seamstress Job</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Customer</label>
                        <div class="input-group">
                            <select name="customer" class="form-select" required>
                                <option value="">Select Customer...</option>
                                {% for c in customers %}
                                <option value="{{ c.id }}">{{ c.name }}</option>
                                {% endfor %}
                            </select>
                            <a href="{% url 'customer_create' %}" class="btn btn-outline-primary" target="_blank" title="Add New Customer"><i class="bi bi-person-plus"></i></a>
                        </div>
                    </div>
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Create Job</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
