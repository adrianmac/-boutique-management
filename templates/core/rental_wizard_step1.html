{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Step 1: Rental Details</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Customer</label>
                        <div class="input-group">
                            {{ form.customer }}
                            <a href="{% url 'customer_create' %}" class="btn btn-outline-primary" target="_blank" title="Add New Customer"><i class="bi bi-person-plus"></i></a>
                        </div>
                    </div>
                    <div class="mb-3">
                        {{ form.rental_date.label_tag }}
                        {{ form.rental_date }}
                    </div>
                    <div class="mb-3">
                        {{ form.return_date.label_tag }}
                        {{ form.return_date }}
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <button type="submit" class="btn btn-primary">Next: Select Items <i class="bi bi-arrow-right"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
